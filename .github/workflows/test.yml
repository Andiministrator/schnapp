name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Wurzelmodul (Programm, ui, i18n, po) gegen das gepatchte Gio (cgo, nur Wayland)
  wurzel:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=novulkan,nox11
      # Zeichentests ohne Fenster (Editor, Navigator, Rollen der Leiste, Lupe, Text): Ein Überspringen wegen fehlendem
      # EGL/GLES ist in jedem Schritt unten ein Fehler, nicht nur im Schritt „Editor-Zeichnen“ (F-616, Karte #235).
      SCHNAPP_HEADLESS_PFLICHT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Bibliotheken für Gio (Wayland, EGL, xkbcommon)
        # libegl-mesa0 und libgl1-mesa-dri: Mesa mit Software-Rasterung für die Zeichentests ohne Fenster (Karte #224);
        # libgles2 liefert libGLESv2.so.2, ohne die Gio headless im Runner übersprang (CI-Befund, F-602, Karte #227)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libegl-dev libxkbcommon-dev libegl-mesa0 libgl1-mesa-dri libgles2
      # Mit Tag probe, sonst fehlen Pakete, deren Dateien alle //go:build probe tragen (cmd/schnapp-fernbedienung, F-715)
      - name: gofmt
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...) $(GOFLAGS=-tags=novulkan,nox11,probe go list -f '{{.Dir}}' ./...))"
      - run: go vet ./...
      - run: go test ./...
      # Zeichnen des Editors ohne Fenster (Gio headless über EGL surfaceless, internal/ui/zeichnen_headless_test.go):
      # SCHNAPP_HEADLESS_PFLICHT=1 (Job-Umgebung oben) macht ein Überspringen (kein EGL/GLES im Runner) zum Fehler
      # (F-602, F-616), damit die Mutanten E37 bis E40 in der CI bewacht sind; dieser Schritt zeigt PASS je Test im Protokoll.
      - name: Editor-Zeichnen ohne Fenster (Protokoll)
        run: go test ./internal/ui -count=1 -run 'TestEditorZeichnet' -v
      # Alle Pakete unter internal/ zusätzlich mit dem Race-Detektor (F-368, Sitzungs-QA 22.11. Q-6; ADR-0020 Nachtrag 11)
      - run: go test -race ./internal/...
      # Mutationsprobe (F-371): Werkzeug prüfen und Muster gegen den Code zählen (Sekunden); der volle Lauf bleibt von Hand
      - name: scripts/mutanten
        working-directory: scripts/mutanten
        run: test -z "$(gofmt -l .)" && go vet . && go test . && go run . -wurzel ../.. -trocken
      # Marken-Werkzeug (Karte #23): bauen und prüfen; der Vergleich mit den SVGs braucht Open Sans und überspringt hier
      - name: brand/werkzeug
        working-directory: brand/werkzeug
        run: test -z "$(gofmt -l .)" && go vet . && go test .
      # install.sh mit eigenem HOME und go-Attrappe (F-324)
      - run: scripts/install-test.sh
      - run: go build -trimpath -o /dev/null ./cmd/schnapp
      # Probe-Build (internal/ui/probe_an.go, F-179): übersetzt und meldet sich mit „+probe“ in --version.
      - run: go vet -tags novulkan,nox11,probe ./internal/ui ./cmd/...
      - run: go test -tags novulkan,nox11,probe -run 'TestLaufeEnglisch|TestProbe' ./cmd/schnapp
      # Tests der Fernbedienung (cmd/schnapp-fernbedienung, Build-Tag probe; F-233)
      - run: go test -tags novulkan,nox11,probe ./cmd/schnapp-fernbedienung

  draw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: draw/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # schnapp-ocr (ADR-0035 Nachtrag 1): eigenes Modul mit tesseract als WebAssembly; der Test erkennt deu und eng
  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Wurzelmodul: der letzte Schritt testet internal/ocr, das braucht dessen Go-Fassung
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # internal/ocr gegen das gebaute Programm (Suche ohne tesseract, Fortschritt); internal/ocr braucht kein Gio
      - name: internal/ocr mit schnapp-ocr
        run: |
          go build -trimpath -o "$RUNNER_TEMP/schnapp-ocr" .
          cd .. && SCHNAPP_OCR_PROGRAMM="$RUNNER_TEMP/schnapp-ocr" go test -count=1 -run 'TestErkenneEigenesEcht' -v ./internal/ocr

  # Gepatchtes Gio (ADR-0015): third_party/gio muss genau Gio + third_party/gio-ausgabe.patch sein.
  gio-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: third_party/gio-patch.sh pruefen
