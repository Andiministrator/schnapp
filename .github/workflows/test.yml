name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zeichnen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeichnen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zeichnen/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
