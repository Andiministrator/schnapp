name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Wurzelmodul (Programm, ui, i18n, po) gegen das gepatchte Gio (cgo, nur Wayland)
  wurzel:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=novulkan,nox11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bibliotheken für Gio (Wayland, EGL, xkbcommon)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libegl-dev libxkbcommon-dev
      - name: gofmt
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o /dev/null ./cmd/schnapp
      # Probe-Build (ui/probe_an.go, F-179): übersetzt und meldet sich mit „+probe“ in --version.
      - run: go vet -tags novulkan,nox11,probe ./ui ./cmd/...
      - run: go test -tags novulkan,nox11,probe -run 'TestLaufeEnglisch|TestProbe' ./cmd/schnapp
      # Tests der Fernbedienung (cmd/schnapp-fernbedienung, Build-Tag probe; F-233)
      - run: go test -tags novulkan,nox11,probe ./cmd/schnapp-fernbedienung

  draw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: draw/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # Gepatchtes Gio (ADR-0015): third_party/gio muss genau Gio + third_party/gio-ausgabe.patch sein.
  gio-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/go.mod
      - run: third_party/gio-patch.sh pruefen

  # Prototyp gegen das gepatchte Gio bauen und testen (cgo, nur Wayland).
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/go.mod
      - name: Bibliotheken für Gio (Wayland, EGL, xkbcommon)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libegl-dev libxkbcommon-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet -tags novulkan,nox11 ./...
      - run: go test -tags novulkan,nox11 ./...
      - run: go build -trimpath -tags novulkan,nox11 -o /dev/null .
